<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
  <h1 class="title">TETRIS</h1>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section">
          <button id="theme-toggle" type="button" aria-pressed="false">☀️ Modo claro</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <!-- ---- Pause menu ---- -->
    <div id="pause-menu" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Menú de pausa">
      <div class="overlay-box pause-box">
        <p class="pause-title">PAUSA</p>
        <button type="button" id="pm-resume" class="pm-btn">Reanudar</button>
        <button type="button" id="pm-restart" class="pm-btn">Reiniciar</button>
        <button type="button" id="pm-controls-btn" class="pm-btn" aria-expanded="false">Ver controles</button>
        <ul id="pm-controls" class="pm-controls hidden">
          <li><kbd>←</kbd><kbd>→</kbd> mover</li>
          <li><kbd>↑</kbd> / <kbd>X</kbd> rotar</li>
          <li><kbd>↓</kbd> bajar</li>
          <li><kbd>Space</kbd> caída</li>
          <li><kbd>P</kbd> / <kbd>Esc</kbd> pausa</li>
        </ul>
        <div class="pm-level">
          <span class="pm-level-label">Nivel inicial</span>
          <button type="button" id="pm-level-dec" class="pm-step" aria-label="Bajar nivel inicial">−</button>
          <span id="pm-level-value" class="pm-level-value">1</span>
          <button type="button" id="pm-level-inc" class="pm-step" aria-label="Subir nivel inicial">+</button>
        </div>
        <p class="pm-hint">Se aplica al reiniciar</p>
      </div>
    </div>
  </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
